# Nome da Aplicação
spring.application.name=Asclepio

# Configurações de Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Segurança / JWT
api.security.token.secret=${JWT_SECRET:my-secreat-key}
security.password.pepper=${PASSWORD_PEPPER}

# Chave que o back-end do painel SaaS manda no header X-Api-Key para chamar /interno/**.
# Vazia = /interno/** fica bloqueado para todos.
interno.api-key=${INTERNAL_API_KEY}

# Configurações de Upload de Arquivos (Multipart)
spring.servlet.multipart.max-file-size=15MB
# Requisição um pouco maior que o arquivo: a imagem de 15MB ainda leva os outros campos junto
spring.servlet.multipart.max-request-size=16MB
# Spring Boot 3.5 limita a 10 partes por multipart; POST /products/criar manda até 13 campos
server.tomcat.max-part-count=30


# Configurações do Cloudflare R2 / S3 Storage
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}
r2.public-url=${R2_PUBLIC_URL}
# Limite de pedidos pelo catálogo público, por IP
catalogo.pedido.rate-limit.por-minuto=5
catalogo.pedido.rate-limit.por-hora=20
# true só se a aplicação rodar atrás de um proxy/load balancer que preenche o X-Forwarded-For
catalogo.pedido.rate-limit.usar-x-forwarded-for=false
